<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team — Catalyst Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <div class="brand-name">Catalyst<span style="color:var(--pale);">.</span></div>
      <div class="brand-sub">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <a href="index.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Overview
      </a>
      <a href="opportunities.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Opportunities
      </a>
      <a href="queries.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Student Queries
      </a>
      <a href="faqs.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        FAQ Management
      </a>
      <a href="contact.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg>
        Contact Info
      </a>
      <a href="team.html" class="active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </a>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="btn btn-secondary btn-sm btn-full" id="signout-btn">Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Team Management</h1>
      <div class="admin-topbar-right">
        <button class="btn btn-primary btn-sm" id="add-btn">+ Add Member</button>
      </div>
    </div>
    <div class="admin-content">
      <div class="admin-table-wrap">
        <div id="team-table"><div class="loading-overlay"><div class="spinner"></div></div></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h2 id="modal-title">Add Team Member</h2>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="f-name" /></div>
      <div class="form-group"><label class="form-label">Role</label><input class="form-input" id="f-role" placeholder="e.g. Platform Lead" /></div>
      <div class="form-group"><label class="form-label">Email (optional)</label><input class="form-input" id="f-email" type="email" /></div>
      <div class="form-group"><label class="form-label">Display Order</label><input class="form-input" id="f-order" type="number" value="0" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-close-2">Cancel</button>
      <button class="btn btn-primary" id="save-btn">Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin, logoutUser } from "../js/auth.js";
  import { showToast, confirmDialog } from "../js/utils.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "../js/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  await requireAdmin();
  document.getElementById("signout-btn").addEventListener("click", logoutUser);

  let allMembers = [], editingId = null;

  async function load() {
    const snap = await getDocs(query(collection(db, "team"), orderBy("order", "asc")));
    allMembers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }

  function render() {
    const el = document.getElementById("team-table");
    if (!allMembers.length) {
      el.innerHTML = `<div class="empty-state"><p>No team members added yet.</p></div>`;
      return;
    }
    el.innerHTML = `<table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Order</th><th>Actions</th></tr></thead>
    <tbody>${allMembers.map(m => `<tr>
      <td style="font-weight:600;">${m.name || ''}</td>
      <td>${m.role || ''}</td>
      <td style="font-size:0.83rem;color:var(--text-muted);">${m.email || '—'}</td>
      <td>${m.order ?? 0}</td>
      <td><div style="display:flex;gap:0.35rem;">
        <button class="btn btn-sm" style="background:var(--beige);border:none;" data-edit="${m.id}">Edit</button>
        <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border:none;" data-delete="${m.id}">Delete</button>
      </div></td>
    </tr>`).join("")}</tbody></table>`;

    el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openModal(b.dataset.edit)));
    el.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => deleteMember(b.dataset.delete)));
  }

  function openModal(id = null) {
    editingId = id;
    const m = id ? allMembers.find(x => x.id === id) : null;
    document.getElementById("modal-title").textContent = id ? "Edit Member" : "Add Team Member";
    document.getElementById("f-name").value = m?.name || "";
    document.getElementById("f-role").value = m?.role || "";
    document.getElementById("f-email").value = m?.email || "";
    document.getElementById("f-order").value = m?.order ?? 0;
    document.getElementById("modal-overlay").classList.add("open");
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    const name = document.getElementById("f-name").value.trim();
    const role = document.getElementById("f-role").value.trim();
    if (!name || !role) { showToast("Name and role are required.", "error"); return; }
    const data = { name, role, email: document.getElementById("f-email").value.trim(), order: parseInt(document.getElementById("f-order").value) || 0, updatedAt: serverTimestamp() };
    try {
      if (editingId) {
        await updateDoc(doc(db, "team", editingId), data);
        const idx = allMembers.findIndex(m => m.id === editingId);
        if (idx !== -1) allMembers[idx] = { id: editingId, ...data };
      } else {
        data.createdAt = serverTimestamp();
        const ref = await addDoc(collection(db, "team"), data);
        allMembers.push({ id: ref.id, ...data });
        allMembers.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      }
      document.getElementById("modal-overlay").classList.remove("open");
      render();
      showToast("Saved.", "success");
    } catch(e) { showToast("Save failed.", "error"); }
  });

  async function deleteMember(id) {
    if (!confirmDialog("Delete this team member?")) return;
    await deleteDoc(doc(db, "team", id));
    allMembers = allMembers.filter(m => m.id !== id);
    render();
    showToast("Deleted.");
  }

  const closeModal = () => document.getElementById("modal-overlay").classList.remove("open");
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-close-2").addEventListener("click", closeModal);
  document.getElementById("add-btn").addEventListener("click", () => openModal());

  load();
</script>
</body>
</html>
