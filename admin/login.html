<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Catalyst</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    body { background: var(--midnight); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .admin-login-card { background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .err-msg { background: #fee2e2; color: #991b1b; border-radius: var(--radius); padding: 0.6rem 0.9rem; font-size: 0.83rem; margin-bottom: 1rem; display: none; }
    .err-msg.show { display: block; }
  </style>
</head>
<body>
<div class="admin-login-card">
  <div style="font-size:1.3rem;font-weight:700;color:var(--midnight);margin-bottom:0.25rem;">Catalyst<span style="color:var(--steel);">.</span></div>
  <div style="font-size:0.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.75rem;">Admin Access</div>
  <div id="err-msg" class="err-msg"></div>
  <div class="form-group">
    <label class="form-label">Email</label>
    <input class="form-input" id="email" type="email" placeholder="admin@example.com" />
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" id="password" type="password" placeholder="Password" />
  </div>
  <button class="btn btn-primary btn-full" id="login-btn">Sign In</button>
  <p style="text-align:center;margin-top:1rem;font-size:0.8rem;"><a href="../index.html" style="color:var(--text-muted);">← Back to Catalyst</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "../js/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function showErr(msg) { const e = document.getElementById("err-msg"); e.textContent = msg; e.classList.add("show"); }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("password").value;
    if (!email || !pw) return showErr("Please enter email and password.");
    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      const profile = await getDoc(doc(db, "users", cred.user.uid));
      if (!profile.exists() || profile.data().role !== "admin") {
        await auth.signOut();
        showErr("You do not have admin access.");
        return;
      }
      window.location.href = "index.html";
    } catch(e) {
      const msgs = { "auth/invalid-credential": "Invalid email or password.", "auth/too-many-requests": "Too many attempts. Try later." };
      showErr(msgs[e.code] || "Sign in failed.");
    } finally { btn.disabled = false; btn.textContent = "Sign In"; }
  });

  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("login-btn").click(); });
</script>
</body>
</html>
