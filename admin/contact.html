<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Info — Catalyst Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <div class="brand-name">Catalyst<span style="color:var(--pale);">.</span></div>
      <div class="brand-sub">Admin Panel</div>
    </div>
    <nav class="admin-nav">
      <a href="index.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Overview
      </a>
      <a href="opportunities.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Opportunities
      </a>
      <a href="queries.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Student Queries
      </a>
      <a href="faqs.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        FAQ Management
      </a>
      <a href="contact.html" class="active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg>
        Contact Info
      </a>
      <a href="team.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </a>
    </nav>
    <div class="admin-sidebar-footer">
      <button class="btn btn-secondary btn-sm btn-full" id="signout-btn">Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar"><h1>Contact Information</h1></div>
    <div class="admin-content">
      <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;max-width:600px;">
        <div id="form-err" style="background:#fee2e2;color:#991b1b;border-radius:var(--radius);padding:0.6rem 0.9rem;font-size:0.83rem;margin-bottom:1rem;display:none;"></div>
        <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" id="f-email" type="email" /></div>
        <div class="form-group"><label class="form-label">Phone Number</label><input class="form-input" id="f-phone" /></div>
        <div class="form-group"><label class="form-label">Response Time</label><input class="form-input" id="f-response-time" placeholder="e.g. Within 48 hours" /></div>
        <div class="form-group"><label class="form-label">Additional Information</label><textarea class="form-textarea" id="f-additional" rows="3"></textarea></div>
        <button class="btn btn-primary" id="save-btn">Save Contact Info</button>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireAdmin, logoutUser } from "../js/auth.js";
  import { showToast } from "../js/utils.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "../js/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  await requireAdmin();
  document.getElementById("signout-btn").addEventListener("click", logoutUser);

  async function load() {
    const snap = await getDoc(doc(db, "settings", "contact"));
    if (snap.exists()) {
      const c = snap.data();
      document.getElementById("f-email").value = c.email || "";
      document.getElementById("f-phone").value = c.phone || "";
      document.getElementById("f-response-time").value = c.responseTime || "";
      document.getElementById("f-additional").value = c.additionalInfo || "";
    }
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    const data = {
      email: document.getElementById("f-email").value.trim(),
      phone: document.getElementById("f-phone").value.trim(),
      responseTime: document.getElementById("f-response-time").value.trim(),
      additionalInfo: document.getElementById("f-additional").value.trim(),
      updatedAt: serverTimestamp(),
    };
    try {
      await setDoc(doc(db, "settings", "contact"), data);
      showToast("Contact info saved.", "success");
    } catch(e) { showToast("Save failed.", "error"); }
  });

  load();
</script>
</body>
</html>
