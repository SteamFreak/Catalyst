<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Opportunities — Catalyst</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .tracker-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }
    .tracker-table th { background: #f8fafc; padding: 0.65rem 1rem; text-align: left; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .tracker-table td { padding: 0.85rem 1rem; font-size: 0.875rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .tracker-table tr:last-child td { border-bottom: none; }
    .tracker-table tr:hover td { background: #fafbfc; }
    .status-select { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.3rem 0.5rem; font-size: 0.8rem; color: var(--text-primary); background: var(--white); }
    .notes-input { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.3rem 0.5rem; font-size: 0.8rem; width: 100%; min-width: 120px; }
    @media (max-width: 768px) { .tracker-table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>

<nav class="navbar" id="main-navbar"></nav>

<div class="page-header">
  <div class="container">
    <h1>My Opportunities</h1>
    <p>Track your saved opportunities and application progress.</p>
  </div>
</div>

<section class="section-sm">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem;">
      <div class="tabs" style="margin-bottom:0;">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="Saved">Saved</button>
        <button class="tab-btn" data-filter="Planning to Apply">Planning</button>
        <button class="tab-btn" data-filter="Application in Progress">In Progress</button>
        <button class="tab-btn" data-filter="Applied">Applied</button>
        <button class="tab-btn" data-filter="Completed">Completed</button>
      </div>
      <button class="btn btn-secondary btn-sm" id="export-btn">Export CSV</button>
    </div>
    <div id="tracker-wrap">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<footer class="footer" id="main-footer"></footer>

<script type="module">
  import { initNavbar } from "./js/navbar.js";
  import { initFooter } from "./js/footer.js";
  import { requireAuth, logoutUser } from "./js/auth.js";
  import { formatDate, deadlineLabel, showToast } from "./js/utils.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { firebaseConfig } from "./js/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  initNavbar("", "");
  initFooter("");
  const user = await requireAuth();

  let allSaved = [], currentFilter = "all";

  async function load() {
    const snap = await getDocs(collection(db, "users", user.uid, "savedOpportunities"));
    allSaved = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }

  function render() {
    const items = currentFilter === "all" ? allSaved : allSaved.filter(o => o.status === currentFilter);
    const wrap = document.getElementById("tracker-wrap");
    if (items.length === 0) {
      wrap.innerHTML = `<div class="empty-state"><h3>No opportunities here</h3><p>${currentFilter === 'all' ? 'Save opportunities from the <a href="discover.html">Discover</a> page.' : 'No opportunities with this status.'}</p></div>`;
      return;
    }
    wrap.innerHTML = `<table class="tracker-table">
      <thead><tr>
        <th>Opportunity</th><th>Organisation</th><th>Deadline</th><th>Status</th><th>Notes</th><th>Actions</th>
      </tr></thead>
      <tbody>${items.map(o => rowHTML(o)).join("")}</tbody>
    </table>`;
    bindEvents();
  }

  function rowHTML(o) {
    const dl = o.deadline ? deadlineLabel(o.deadline) : '—';
    const d = o.deadline ? (o.deadline.toDate ? o.deadline.toDate() : new Date(o.deadline)) : null;
    const days = d ? Math.ceil((d - Date.now()) / 86400000) : null;
    const STATUSES = ["Saved","Planning to Apply","Application in Progress","Applied","Completed"];
    return `<tr data-id="${o.id}">
      <td><a href="opportunity.html?id=${o.id}" style="font-weight:600;color:var(--midnight);">${o.title || 'Opportunity'}</a></td>
      <td style="color:var(--text-secondary);">${o.organisation || '—'}</td>
      <td><span class="${days !== null && days <= 7 && days >= 0 ? 'urgent' : ''}" style="font-size:0.83rem;">${dl}</span></td>
      <td><select class="status-select" data-id="${o.id}">
        ${STATUSES.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join("")}
      </select></td>
      <td><input class="notes-input" type="text" placeholder="Add note…" value="${o.notes || ''}" data-id="${o.id}" /></td>
      <td><button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border:none;" data-remove="${o.id}">Remove</button></td>
    </tr>`;
  }

  function bindEvents() {
    document.querySelectorAll(".status-select").forEach(sel => {
      sel.addEventListener("change", async () => {
        await updateDoc(doc(db, "users", user.uid, "savedOpportunities", sel.dataset.id), { status: sel.value });
        const item = allSaved.find(o => o.id === sel.dataset.id);
        if (item) item.status = sel.value;
        showToast("Status updated.", "success");
      });
    });
    document.querySelectorAll(".notes-input").forEach(inp => {
      inp.addEventListener("blur", async () => {
        await updateDoc(doc(db, "users", user.uid, "savedOpportunities", inp.dataset.id), { notes: inp.value });
        const item = allSaved.find(o => o.id === inp.dataset.id);
        if (item) item.notes = inp.value;
      });
    });
    document.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Remove this opportunity from your tracker?")) return;
        await deleteDoc(doc(db, "users", user.uid, "savedOpportunities", btn.dataset.remove));
        allSaved = allSaved.filter(o => o.id !== btn.dataset.remove);
        render();
        showToast("Removed.");
      });
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById("export-btn").addEventListener("click", () => {
    const rows = [["Title","Organisation","Deadline","Status","Notes"]];
    allSaved.forEach(o => {
      const d = o.deadline ? (o.deadline.toDate ? o.deadline.toDate() : new Date(o.deadline)).toLocaleDateString() : '';
      rows.push([o.title || '', o.organisation || '', d, o.status || '', o.notes || '']);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = "my-opportunities.csv";
    a.click();
  });

  load();
</script>
</body>
</html>
